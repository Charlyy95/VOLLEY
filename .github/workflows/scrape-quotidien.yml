name: Mise à jour du calendrier

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le scraper
        run: python scraper.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches*.json calendrier*.ics
          git diff --staged --quiet || git commit -m "Mise à jour automatique du calendrier"
          git push

      - name: Garder le workflow actif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .workflow_id)
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/$ID/enable
